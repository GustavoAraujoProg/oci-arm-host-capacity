name: OCI Provisioning

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install

      - name: Preparar Ambiente e Limpar Aspas
        run: |
          # Cria o arquivo da chave privada
          echo "${{ secrets.OCI_KEY_FILE }}" > oci_api_key.pem
          chmod 600 oci_api_key.pem
          
          # Esta função vai remover aspas de todas as variáveis antes de salvar no .env
          clean_secret() {
            echo "$1" | sed 's/"//g' | sed "s/'//g"
          }

          echo "OCI_REGION=$(clean_secret "${{ secrets.OCI_REGION }}")" >> .env
          echo "OCI_USER_ID=$(clean_secret "${{ secrets.OCI_USER_ID }}")" >> .env
          echo "OCI_TENANCY_ID=$(clean_secret "${{ secrets.OCI_TENANCY_ID }}")" >> .env
          echo "OCI_KEY_FINGERPRINT=$(clean_secret "${{ secrets.OCI_FINGERPRINT }}")" >> .env
          echo "OCI_SUBNET_ID=$(clean_secret "${{ secrets.OCI_SUBNET_ID }}")" >> .env
          echo "OCI_IMAGE_ID=$(clean_secret "${{ secrets.OCI_IMAGE_ID }}")" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=$(clean_secret "${{ secrets.OCI_AVAILABILITY_DOMAIN }}")" >> .env
          echo "OCI_SSH_PUBLIC_KEY=$(clean_secret "${{ secrets.OCI_SSH_PUBLIC_KEY }}")" >> .env
          echo "OCI_OCPUS=4" >> .env
          echo "OCI_MEMORY_IN_GBS=24" >> .env
          echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
          echo "OCI_PRIVATE_KEY_FILENAME=oci_api_key.pem" >> .env

      - name: Run provisioning
        run: php index.php
