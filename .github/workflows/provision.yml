name: OCI Provisioning

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install

      - name: Construir ambiente para o PHP
        run: |
          # 1. Cria o arquivo .env injetando os seus secrets do GitHub
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" >> .env
          echo "OCI_USER_ID=${{ secrets.OCI_USER_ID }}" >> .env
          echo "OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}" >> .env
          echo "OCI_KEY_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}" >> .env
          echo "OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}" >> .env
          echo "OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}" >> .env
          echo "OCI_OCPUS=4" >> .env
          echo "OCI_MEMORY_IN_GBS=24" >> .env
          echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
          
          # 2. Aponta o nome do arquivo da chave
          echo "OCI_PRIVATE_KEY_FILENAME=oci_api_key.pem" >> .env
          
          # 3. Cria o arquivo físico da chave privada com as permissões corretas
          echo "${{ secrets.OCI_KEY_FILE }}" > oci_api_key.pem
          chmod 600 oci_api_key.pem

      - name: Run provisioning
        run: php index.php
